{% extends "layout.html" %}

{% block title %}
    Create Your Account &bull; DoJay
{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
        
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-white mb-1" data-i18n="join_dojay">Get Started with DoJay</h1>
            <p class="text-secondary small" data-i18n="register_subtitle">Real-time music queues for stages, clubs, and private events</p>
        </div>

        <div class="card dojay-card p-4 p-md-5">
            <form action="/register" method="POST">
                
                <!-- Role Selector -->
                <div class="mb-4">
                    <label class="form-label d-block text-white fw-semibold mb-2" data-i18n="account_type">Account Type</label>
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="role_dj" value="dj" required>
                            <label class="btn btn-outline-secondary w-100 py-3 d-flex flex-column align-items-center text-center" for="role_dj">
                                <i class="bi bi-vinyl fs-3 text-warning mb-1"></i>
                                <span class="fw-bold text-white" data-i18n="role_dj_title">DJ / Host</span>
                                <small class="text-muted" style="font-size: 0.75rem;" data-i18n="role_dj_desc">Manage queues & QR</small>
                            </label>
                        </div>
                        <div class="col-6">
                            <input type="radio" class="btn-check" name="role" id="role_guest" value="guest" checked required>
                            <label class="btn btn-outline-secondary w-100 py-3 d-flex flex-column align-items-center text-center" for="role_guest">
                                <i class="bi bi-music-note-beamed fs-3 text-info mb-1"></i>
                                <span class="fw-bold text-white" data-i18n="role_guest_title">Guest</span>
                                <small class="text-muted" style="font-size: 0.75rem;" data-i18n="role_guest_desc">Request & vote songs</small>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n="username">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="Choose a username" 
                        data-i18n-placeholder="username_placeholder"
                        autocomplete="username" 
                        maxlength="40"
                        required 
                        autofocus
                    >
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="Minimum 6 characters" 
                        data-i18n-placeholder="password_placeholder"
                        autocomplete="new-password" 
                        minlength="6"
                        required
                    >
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmation" class="form-label" data-i18n="confirm_password">Confirm Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="confirmation" 
                        name="confirmation" 
                        placeholder="Re-enter password" 
                        data-i18n-placeholder="confirm_password_placeholder"
                        autocomplete="new-password" 
                        minlength="6"
                        required
                    >
                </div>

                <!-- Submit Button -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-dojay-primary py-2 fw-semibold" data-i18n="create_account_btn">
                        Create Account
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 small">
                <span class="text-muted" data-i18n="already_have_account">Already have an account?</span>
                <a href="/login" class="text-decoration-none fw-semibold ms-1" style="color: var(--accent-cyan);" data-i18n="nav_sign_in">
                    Sign In
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
