{% extends "layout.html" %}

{% block title %}
    Sign In &bull; DoJay
{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
        
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-white mb-1" data-i18n="welcome_back">Welcome Back</h1>
            <p class="text-secondary small" data-i18n="login_subtitle">Sign in to manage your stage or submit song requests</p>
        </div>

        <div class="card dojay-card p-4 p-md-5">
            <form action="/login" method="POST">
                
                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n="username">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        data-i18n-placeholder="username_placeholder"
                        autocomplete="username" 
                        required 
                        autofocus
                    >
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label" data-i18n="password">Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        data-i18n-placeholder="password_placeholder"
                        autocomplete="current-password" 
                        required
                    >
                </div>

                <!-- Submit Button -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-dojay-primary py-2 fw-semibold" data-i18n="sign_in_btn">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25 small">
                <span class="text-muted" data-i18n="new_to_dojay">New to DoJay?</span>
                <a href="/register" class="text-decoration-none fw-semibold ms-1" style="color: var(--accent-cyan);" data-i18n="create_an_account">
                    Create an Account
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
