{% extends "layout.html" %}

{% block title %}
    Error &bull; DoJay
{% endblock %}

{% block main %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6 text-center py-5">
        <div class="p-4 p-md-5 rounded-4 dojay-card">
            <div class="d-inline-flex p-3 rounded-circle mb-3 bg-danger bg-opacity-10 border border-danger border-opacity-25">
                <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
            </div>
            <h1 class="display-4 fw-bold text-white mb-2">{{ top }}</h1>
            <p class="text-secondary fs-5 mb-4">{{ bottom }}</p>
            <a href="/" class="btn btn-dojay-primary px-4 py-2">
                <i class="bi bi-arrow-left me-1"></i> Return to Safety
            </a>
        </div>
    </div>
</div>
{% endblock %}
